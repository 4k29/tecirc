title: Tecirc
description: Tecircは、ガジェット、サービス、情報技術の設計や体験、その背景にある意図を考察する場所です。製品やUI、AIなどを、使う側とつくる側の両方の視点から考えます。
author: うまいしか
image: /images/ogp/tecirc.png
twitter_username: "@p_horeer"
# Fill only with the verification values issued by the respective service.
google_site_verification: ""
bing_site_verification: ""
url: https://4k29.github.io
baseurl: /tecirc
lang: ja
timezone: Asia/Tokyo
encoding: utf-8

markdown: kramdown
kramdown:
  input: GFM
  hard_wrap: false
  syntax_highlighter: rouge

collections:
  memories:
    output: true
    permalink: /memory/:name/
    sort_by: date
  notes:
    output: true
    permalink: /notes/:name/
    sort_by: date
    future: true

defaults:
  - scope:
      path: ""
      type: memories
    values:
      layout: memory
  - scope:
      path: ""
      type: notes
    values:
      layout: note
      author: うまいしか

exclude:
  - node_modules
  - package.json
  - package-lock.json
  - vendor
