<a class="skip-link" href="{% if page.url == '/' or page.url == '/en/' %}#top{% else %}#main-content{% endif %}">{% if current_lang == 'en' %}Skip to content{% else %}本文へスキップ{% endif %}</a>
<header class="global-header">
  <a class="global-brand" href="{{ locale_prefix | append: '/' | relative_url }}" aria-label="Tecirc Home">
    {% include tecirc-mark.html %}
    <span>Tecirc</span>
  </a>
  <nav class="global-nav" aria-label="{% if current_lang == 'en' %}Main navigation{% else %}メインナビゲーション{% endif %}">
    <a href="{{ locale_prefix | append: '/about/' | relative_url }}"{% if japanese_url == '/about/' %} aria-current="page"{% endif %}>About</a>
    <a href="{{ locale_prefix | append: '/notes/' | relative_url }}"{% if japanese_url contains '/notes/' %} aria-current="page"{% endif %}>Notes</a>
    <a href="{{ locale_prefix | append: '/memory/' | relative_url }}"{% if japanese_url contains '/memory/' %} aria-current="page"{% endif %}>Memory</a>
  </nav>
</header>
