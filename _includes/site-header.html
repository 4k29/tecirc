<style>
  :root {
    --site-shell-width: 800px;
    --site-shell-gutter: 40px;
    --site-shell-gutter-mobile: 32px;
  }

  .global-header,
  body > main,
  body > footer,
  .note-content,
  .note-footer,
  .memory-content,
  .memory-footer {
    width: min(calc(100% - var(--site-shell-gutter)), var(--site-shell-width)) !important;
    margin-left: auto !important;
    margin-right: auto !important;
  }

  .global-header {
    position: sticky !important;
    top: 0;
    z-index: 900;
    min-height: 64px;
    height: auto !important;
    flex-wrap: wrap;
    gap: 0 12px;
    margin-top: 18px !important;
    border-bottom: 1px solid var(--line);
    display: flex !important;
    align-items: center !important;
    justify-content: space-between !important;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", sans-serif !important;
    font-style: normal !important;
    letter-spacing: -0.01em !important;
    background: var(--bg);
    isolation: isolate;
    transition: transform .26s cubic-bezier(.22, 1, .36, 1);
    will-change: transform;
  }

  .global-header::before {
    content: "";
    position: absolute;
    z-index: -1;
    top: 0;
    bottom: 0;
    left: 50%;
    width: 100vw;
    transform: translateX(-50%);
    background: var(--bg);
  }

  .global-header.is-scrolled {
    background: var(--bg);
  }

  .global-header.is-hidden {
    transform: translateY(calc(-100% - 20px));
  }

  .global-header .global-brand {
    color: var(--text);
    display: inline-flex;
    align-items: center;
    gap: 8px;
    font-family: inherit !important;
    font-size: .875rem !important;
    font-style: normal !important;
    font-weight: 560 !important;
    line-height: 1 !important;
    letter-spacing: -.015em !important;
  }

  .global-header .global-nav {
    display: flex !important;
    align-items: center !important;
    gap: 0 22px !important;
    flex-wrap: wrap;
  }

  .global-header .global-nav a,
  .global-header .global-nav a[aria-current="page"] {
    color: var(--muted);
    font-family: inherit !important;
    font-size: .8125rem !important;
    font-style: normal !important;
    font-weight: 400 !important;
    line-height: 1 !important;
    letter-spacing: -0.01em !important;
  }

  .global-header .global-nav a:hover,
  .global-header .global-nav a[aria-current="page"] {
    color: var(--text);
  }

  .global-header .global-brand,
  .global-header .global-nav a {
    min-height: 44px;
    min-width: 44px;
    display: inline-flex;
    align-items: center;
  }

  .global-header .global-nav a[aria-current="page"] {
    text-decoration: underline;
    text-underline-offset: .45em;
    text-decoration-thickness: 1px;
  }

  .global-header:focus-within { transform: none; }

  .note-hero h1,
  .article-body,
  .article-share,
  .related-notes {
    max-width: 100% !important;
  }

  @media (max-width: 560px) {
    .global-header,
    body > main,
    body > footer,
    .note-content,
    .note-footer,
    .memory-content,
    .memory-footer {
      width: calc(100% - var(--site-shell-gutter-mobile)) !important;
    }

    .global-header .global-nav { gap: 6px !important; }

    .global-header .global-nav a,
    .global-header .global-nav a[aria-current="page"] {
      font-size: .8125rem !important;
      font-weight: 400 !important;
    }

    .global-header .theme-toggle {
      position: static !important;
      z-index: auto !important;
      width: 44px !important;
      height: 44px !important;
      margin: 0 !important;
      flex: 0 0 44px;
      opacity: 1;
    }

    .global-header .theme-toggle:hover { background: transparent; }
    .global-header .theme-toggle-icon { width: 15px; height: 15px; }
  }

  @media (prefers-reduced-motion: reduce) {
    .global-header { transition: none !important; }
  }
</style>
<a class="skip-link" href="{% if page.url == '/' or page.url == '/en/' %}#top{% else %}#main-content{% endif %}">{% if current_lang == 'en' %}Skip to content{% else %}本文へスキップ{% endif %}</a>
<header class="global-header">
  <a class="global-brand" href="{{ locale_prefix | append: '/' | relative_url }}" aria-label="Tecirc Home">
    {% include tecirc-mark.html %}
    <span>Tecirc</span>
  </a>
  <nav class="global-nav" aria-label="{% if current_lang == 'en' %}Main navigation{% else %}メインナビゲーション{% endif %}">
    <a href="{{ locale_prefix | append: '/about/' | relative_url }}"{% if japanese_url == '/about/' %} aria-current="page"{% endif %}>About</a>
    <a href="{{ locale_prefix | append: '/notes/' | relative_url }}"{% if japanese_url contains '/notes/' %} aria-current="page"{% endif %}>Notes</a>
    <a href="{{ locale_prefix | append: '/memory/' | relative_url }}"{% if japanese_url contains '/memory/' %} aria-current="page"{% endif %}>Memory</a>
    {% if translated_page %}
    <a class="language-switch" href="{% if current_lang == 'en' %}{{ japanese_url | relative_url }}{% else %}{{ english_url | relative_url }}{% endif %}" hreflang="{% if current_lang == 'en' %}ja{% else %}en{% endif %}" aria-label="{% if current_lang == 'en' %}JP / EN — Switch to Japanese{% else %}JP / EN：英語に切り替え{% endif %}">
      <span{% if current_lang != 'en' %} class="language-current"{% endif %}>JP</span><span aria-hidden="true">/</span><span{% if current_lang == 'en' %} class="language-current"{% endif %}>EN</span>
    </a>
    {% endif %}
  </nav>
</header>
