<div class="note-search" hidden>
  <label for="note-query">{% if current_lang == 'en' %}Search notes{% else %}記事を探す{% endif %}</label>
  <input id="note-query" type="search" placeholder="{% if current_lang == 'en' %}Title, topic, or keyword{% else %}タイトル・テーマ・キーワード{% endif %}" autocomplete="off" />
  <div class="topic-filters" role="group" aria-label="{% if current_lang == 'en' %}Topics{% else %}テーマ{% endif %}">
    {% assign topics = 'All,Apple,AI,Nothing,Meta' | split: ',' %}
    {% for topic in topics %}<button type="button" data-topic="{{ topic }}" aria-pressed="{% if forloop.first %}true{% else %}false{% endif %}">{% if topic == 'All' and current_lang != 'en' %}すべて{% else %}{{ topic }}{% endif %}</button>{% endfor %}
  </div>
  <p id="note-results" role="status" aria-live="polite"></p>
</div>
<script src="{{ '/notes/search.js' | relative_url }}" defer></script>
