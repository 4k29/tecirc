name: Optimize Display Images

on:
  push:
    branches: [main]
    paths:
      - "images/memory/**"
      - "images/notes/**"
      - "scripts/optimize-media.py"
      - "scripts/media-requirements.txt"
      - ".github/workflows/optimize-memory-images.yml"
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: optimize-display-images
  cancel-in-progress: false

jobs:
  optimize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install image encoder
        run: python -m pip install -r scripts/media-requirements.txt
      - name: Test image processing
        run: python tests/media-generator.test.py
      - name: Generate WebP sizes without altering originals
        run: python scripts/optimize-media.py
      - name: Check image references
        run: npm run doctor
      - name: Publish updated derivatives
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git add images/optimized _data/media.json
          if git diff --cached --quiet; then
            echo "Display images are current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Generate responsive display images"
          git push
          # GITHUB_TOKEN commits do not trigger the ordinary Pages push workflow.
          gh api --method POST "repos/$GITHUB_REPOSITORY/pages/builds"
